<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Love You ❤️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      font-family: 'Georgia', serif;
      overflow: hidden;
    }
    .heart {
      font-size: 120px;
      animation: beat 1.2s infinite;
      filter: drop-shadow(0 0 20px rgba(255, 77, 109, 0.8));
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.25); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
    }
    h1 {
      margin-top: 20px;
      color: #ff4d6d;
      font-size: 2.5rem;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(255, 77, 109, 0.7);
      animation: fadeIn 2s ease-in-out;
    }
    p {
      margin-top: 15px;
      color: #ffd6e0;
      font-size: 1.1rem;
      font-style: italic;
      animation: fadeIn 3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Hati kecil berjatuhan */
    .falling {
      position: absolute;
      top: -50px;
      color: #ff4d6d;
      font-size: 20px;
      animation: fall linear infinite;
      opacity: 0.8;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="heart">❤️</div>
  <h1>I LOVE YOU</h1>
  <p>Dari hatiku yang paling dalam, untukmu.</p>

  <script>
    // Membuat hati kecil berjatuhan
    const emojis = ['❤️', '💕', '💖', '💗', '💓'];
    setInterval(() => {
      const heart = document.createElement('div');
      heart.className = 'falling';
      heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
      heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }, 300);
  </script>
</body>
</html>
